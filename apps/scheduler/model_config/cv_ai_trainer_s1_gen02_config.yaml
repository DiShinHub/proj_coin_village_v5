model_name: cv_ai_trainer_s1_gen02
model_type: LSTM
features:
    - timestamp
    - weekday
    - open
    - high
    - low
    - close
    - volume
    - volume_ma5
    - volume_ma20
    - volume_ratio
    - obv
    - vwap
    - volume_volatility
    - volume_spike
    - rsi
    - macd
    - macd_signal
    - bollinger_partition
    - bollinger_partition_prev
    - atr
    - cci
    - stochastic_k
    - stochastic_d
    - roc
    - momentum
    - ema_cross_up
    - cdl2crows
    - cdl3blackcrows
    - cdl3inside
    - cdl3linestrike
    - cdl3outside
    - cdl3starsinsouth
    - cdl3whitesoldiers
    - cdlabandonedbaby
    - cdladvanceblock
    - cdlbelthold
    - cdlbreakaway
    - cdlclosingmarubozu
    - cdlconcealbabyswall
    - cdlcounterattack
    - cdldarkcloudcover
    - cdldoji
    - cdldojistar
    - cdldragonflydoji
    - cdlengulfing
    - cdleveningdojistar
    - cdleveningstar
    - cdlgapsidesidewhite
    - cdlgravestonedoji
    - cdlhammer
    - cdlhangingman
    - cdlharami
    - cdlharamicross
    - cdlhighwave
    - cdlhikkake
    - cdlhikkakemod
    - cdlhomingpigeon
    - cdlidentical3crows
    - cdlinneck
    - cdlinvertedhammer
    - cdlkicking
    - cdlkickingbylength
    - cdlladderbottom
    - cdllongleggeddoji
    - cdllongline
    - cdlmarubozu
    - cdlshortline
    - cdlspinningtop
    - cdlstalledpattern
    - cdlsticksandwich
    - cdltakuri
    - cdltasukigap
    - cdlthrusting
    - cdltristar
    - cdlunique3river
    - cdlupsidegap2crows
    - cdlxsidegap3methods

targets: 
    - change_after_1day
    # - change_after_3day

derived_params:
  - name: change_after_1day
    expression: >
      2 if ((float(price_after_1day) - float(price_on_time)) / float(price_on_time) * 100) > 2
      else 0 if ((float(price_after_1day) - float(price_on_time)) / float(price_on_time) * 100) < -2
      else 1
  # - name: change_after_3day
  #   expression: "close.rolling(5).mean()"
      
preprocessing:
  fillna: all
  convert_numeric: all
  scaling: 
    - open
    - high
    - low
    - close
    - volume
    - volume_ma5
    - volume_ma20
    - volume_ratio
    - obv
    - vwap
    - volume_volatility
    - volume_spike
    - rsi
    - macd
    - macd_signal
    - bollinger_partition
    - bollinger_partition_prev
    - atr
    - cci
    - stochastic_k
    - stochastic_d
    - roc
    - momentum
    - ema_cross_up

hyperparameters:
  time_steps: 40
  batch_size: 32
  epochs: 20
  early_stop: True

  